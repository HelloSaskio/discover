<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saski’O Discover</title>
<meta name="description" content="Experience-led travel. Tell me where you’d love to go, and I’ll start shaping a trip around the way you like to travel.">
<meta name="robots" content="noindex,nofollow">

<meta property="og:type" content="website">
<meta property="og:title" content="Saski’O Discover">
<meta property="og:description" content="Experience-led travel. Life’s biggest trips — start your journey here.">
<meta property="og:image" content="https://hellosaskio.github.io/discover/og.png">
<meta property="og:url" content="https://hellosaskio.github.io/discover/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--font:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif; --serif:'Newsreader', Georgia, serif; --mono:'DM Mono', ui-monospace, 'Courier New', monospace; --wm:none}
*{box-sizing:border-box}
em,i,cite,address,dfn,var{font-style:normal}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#F4F2EF;color:#1F1B19;font-family:var(--font)}
button{font-family:inherit;cursor:pointer}
.screen{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font)}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.hp input{font-size:16px}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* Ink & Paper — approved palette */
.theme-mono{
  --bg:#F4F2EF; --ink:#1F1B19; --body:#3D3835; --muted:#736C67; --line:#D8D2CC; --soft:#EBE7E3;
  --field:#FBFAF8; --btn:#1F1B19; --btn-ink:#F4F2EF; --chip-on:#1F1B19; --chip-on-ink:#F4F2EF; --err:#A1271F;
}
:root{--font:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif; --serif:'Newsreader', Georgia, serif; --mono:'DM Mono', ui-monospace, 'Courier New', monospace; --wm:none}
*{box-sizing:border-box}
em,i,cite,address,dfn,var{font-style:normal}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#ECEEF0;color:#1d2327;font-size:14px}
button{font-family:inherit;cursor:pointer}

/* ---------- Customer UI ---------- */
/* Saski’O wordmark: drawn from the approved logo artwork, recoloured to the text colour.
   Used every time "Saski’O" appears, and for nothing else. */
.wm{display:inline-block;height:.74em;aspect-ratio:716/157;background:currentColor;vertical-align:baseline;
  -webkit-mask-image:var(--wm);mask-image:var(--wm);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:left bottom;mask-position:left bottom}
.brand{text-align:center;color:var(--ink)}
.brand .wm{font-size:44px}
.f-head .brand .wm{font-size:28px}
.eyebrow{font-size:10.5px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.type{font-family:var(--mono);font-weight:300;letter-spacing:.02em;text-transform:none}
.brand .eyebrow{margin-top:12px}

.home{padding:46px 28px 0}
.home .intro{font-family:var(--serif);font-size:19px;line-height:1.55;font-weight:300;color:var(--body);margin:40px 0 40px}

.stages-title{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.stages-title::after{content:"";flex:1;height:1px;background:var(--line)}
.stage{display:grid;grid-template-columns:38px 1fr;gap:4px 10px;padding:20px 0;border-bottom:1px solid var(--line)}
.stage .n{font-family:var(--mono);font-size:12px;font-weight:300;color:var(--muted);padding-top:2px}
.stage h3{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.stage p{margin:0;font-size:14px;line-height:1.6;color:var(--body)}
.primary{display:block;width:100%;border:0;border-radius:999px;padding:17px 18px;font-size:15px;font-weight:500;letter-spacing:.04em;
  background:var(--btn);color:var(--btn-ink);font-family:var(--font);text-align:center;text-decoration:none;transition:transform .15s, opacity .15s}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.55;cursor:wait}
.cta-wrap{padding:34px 0 10px}
.micro{font-family:var(--mono);font-weight:300;font-size:11.5px;text-align:center;margin-top:12px;color:var(--muted)}
.foot{margin-top:48px;padding:20px 28px 30px;font-size:11.5px;font-family:var(--mono);font-weight:300;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.foot a{color:var(--muted)}

.f-head{padding:20px 24px 0}
.progress{margin:18px 0 6px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink);transition:width .3s}
.fbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.tback{justify-self:start;border:0;background:none;color:var(--ink);font-family:var(--font);font-size:14px;padding:10px 12px 10px 0;min-height:44px;cursor:pointer}
.stepmeta{font-family:var(--mono);font-size:11px;font-weight:300;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between}
.f-body{padding:8px 24px 26px}
.f-body h2{font-weight:500;font-size:17px;letter-spacing:0;margin:20px 0 4px;color:var(--ink)}
.f-body .lede{font-family:var(--serif);font-weight:300;color:var(--body);font-size:15px;margin:0 0 6px}
.field{margin:22px 0}
.field > label,.field > .lbl{display:block;font-size:13.5px;font-weight:500;margin-bottom:8px;color:var(--ink)}
.opt{font-weight:400;color:var(--muted);font-size:12px}
.sub{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=date],.field select,.field textarea{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px;font-family:var(--font);color:var(--ink)}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.field textarea.short{min-height:64px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.field,.field input,.field textarea,.field select{scroll-margin-top:90px;scroll-margin-bottom:120px}
.count{font-family:var(--mono);font-weight:300;font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
.count.near{color:var(--err)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--err)}
.err{color:var(--err);font-size:12.5px;margin-top:6px;display:none}
.field.invalid .err{display:block}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:11px 15px;min-height:44px;font-size:14px;color:var(--ink);font-family:var(--font)}
.choice[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.choices.stack{flex-direction:column}
.choices.stack .choice{border-radius:10px;text-align:left;padding:13px 15px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2 > div{min-width:0}
.field input[type=date]{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none;min-height:48px;line-height:1.2}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.row2 label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:8px 8px 8px 15px;margin-bottom:8px}
.stepper .who{font-size:14.5px;line-height:1.3}
.stepper .ctl{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1;color:var(--ink)}
.stepper output{min-width:18px;text-align:center;font-weight:600}
.agelbl{font-size:13px;margin:12px 0 8px;color:var(--ink)}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ages select{padding:11px;font-size:16px}
.reveal{margin-top:12px;padding-left:14px;border-left:2px solid var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;margin:12px 0;color:var(--body)}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--ink)}
.check a{color:var(--ink)}
.navbtns{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:26px}
.navbtns .back{border:0;background:none;color:var(--ink);font-size:14px;padding:12px 4px;text-decoration:underline;text-underline-offset:3px}
.navbtns .primary{width:auto;flex:1;max-width:220px;margin-left:auto}
.proposed{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#29436b;background:#E6ECF5;border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.alert{background:#FCEBEA;border:1px solid #F1C3C0;color:#7d1a14;border-radius:10px;padding:14px;font-size:13.5px;line-height:1.5;margin-top:16px}
.alert button{margin-top:10px;border:1px solid #7d1a14;background:transparent;color:#7d1a14;border-radius:999px;padding:8px 16px;font-size:13px;font-family:var(--font)}

.ty{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 30px;text-align:center}
.ty h2{font-family:var(--serif);font-weight:300;font-size:24px;line-height:1.3;margin:0 0 14px}
.ty .sign{font-family:var(--serif);font-weight:300;font-size:18px;color:var(--body);line-height:1.6}
.ty .sign .wm{font-size:30px;margin:10px 0 6px;color:var(--ink)}
.ty .x{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:300;text-transform:none}

.privnote{font-size:12.5px;line-height:1.55;color:var(--muted);margin:18px 0 4px}
.privnote a,.foot button.lnk{color:var(--ink)}
button.lnk{background:none;border:0;padding:0;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:inherit}
.pn{padding:26px 26px 34px}
.pn h2{font-weight:500;font-size:17px;margin:22px 0 4px;color:var(--ink)}
.pn h3{font-size:13.5px;font-weight:600;margin:20px 0 4px;color:var(--ink)}
.pn p,.pn li{font-size:13.5px;line-height:1.6;color:var(--body);margin:0 0 8px}
.pn ul{padding-left:18px;margin:0 0 8px}
.pn .ver{font-family:var(--mono);font-weight:300;font-size:11px;color:var(--muted)}
.pn .back{border:0;background:none;color:var(--ink);font-size:14px;padding:12px 12px 12px 0;min-height:44px;text-decoration:underline;text-underline-offset:3px;font-family:var(--font)}
/* Responsive: content column stays readable on tablets/desktop */
.home,.f-head,.f-body,.ty,.pn{max-width:600px;margin-left:auto;margin-right:auto;width:100%}
.foot{max-width:600px;margin-left:auto;margin-right:auto}
@media (max-width:359px){.row2{grid-template-columns:1fr}.home{padding:36px 20px 0}.f-head{padding:18px 18px 0}.f-body{padding:8px 18px 24px}.home .intro{font-size:18px}.ages{grid-template-columns:repeat(2,1fr)}.navbtns .primary{max-width:none}}
@media (min-width:768px){.home{padding-top:80px}.home .intro{font-size:21px}.brand .wm{font-size:52px}.f-head{padding-top:40px}}

.tel{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--field);overflow:hidden}
.tel .cc{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--line);font-size:16px;color:var(--ink);white-space:nowrap;flex:none}
.field .tel input[type=tel]{border:0;border-radius:0;flex:1;min-width:0;background:transparent}
.field .tel input[type=tel]:focus{outline:none}
.tel:focus-within{outline:2px solid var(--ink);outline-offset:1px}
.field.invalid .tel{border-color:var(--err)}

.nw{white-space:nowrap}
.ty .note{font-family:var(--font);font-size:13px;line-height:1.6;color:var(--muted);max-width:300px;margin:32px auto 0}
.cta-wrap.cta-top{padding:4px 0 34px}
</style>
</head>

function uid(){try{return crypto.randomUUID();}catch(e){return 'sub-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}}
function fromUrl(){
  const q=new URLSearchParams(location.search), g=k=>(q.get(k)||'').slice(0,100);
  const direct=g('go')==='form';
  return {screen:direct?'form':(location.hash==='#privacy'?'privacy':'home'),
    hidden:{utm_source:g('utm_source'),utm_medium:g('utm_medium'),utm_campaign:g('utm_campaign'),utm_content:g('utm_content'),fbclid:!!q.get('fbclid'),entry:direct?'direct':'homepage'}};
}
function blank(){return {dest:'',dateMode:'',from:'',to:'',flex:'',duration:'',adults:2,children:0,ages:[],budget:'',looking:'',found:'',interests:[],notes:'',name:'',email:'',phone:'',contact:'',marketing:false,ukResident:false};}
// UK mobile: accepts 07…, +44 7…, 0044 7…, 44 7…, (0)7… or 7…; returns '+44 7xxx xxxxxx' or '' if not a UK mobile
function ukMobile(raw){let s=String(raw||'').replace(/\(0\)/g,'').replace(/[\s\-().]/g,'');if(!s)return '';if(s.startsWith('+44'))s=s.slice(3);else if(s.startsWith('0044'))s=s.slice(4);else if(s.startsWith('44')&&s.length===12)s=s.slice(2);else if(s.startsWith('0'))s=s.slice(1);return /^7\d{9}$/.test(s)?'+44 '+s.slice(0,4)+' '+s.slice(4):'';}
function fresh(){

  return {screen:u.screen,step:1,sending:false,error:false,d:blank(),hidden:u.hidden,submissionId:uid(),prev:'home'};
}

}
function progress(){
  const pct={1:33,2:66,3:100}[S.step], names={1:'Your trip',2:'Your preferences',3:'Let’s connect'};
  return `<div class="f-head"><div class="fbar"><button type="button" class="tback" data-topback>← Back</button><div class="brand">${W}</div><span></span></div>

    <div class="stepmeta"><span>Step ${S.step} of 3 · ${names[S.step]}</span><span>${{1:'About 2 minutes',2:'About 1 minute left',3:'Almost done'}[S.step]}</span></div></div>`;
}
function chips(name,list,val,multi,stack){
  return `<div class="choices ${stack?'stack':''}" data-chips="${name}" data-multi="${multi?1:0}">`+
    list.map(o=>`<button type="button" class="choice" aria-pressed="${multi?val.includes(o):val===o}" data-val="${esc(o)}">${esc(o)}</button>`).join('')+`</div>`;
}

  if(S.step===3){
    h+=`<h2>Let’s connect</h2><p class="lede">So I can get back to you about your trip.</p>
    <div class="field" data-f="name"><label for="name">Your name</label><input type="text" id="name" maxlength="${MAX.name}" autocomplete="name" autocapitalize="words" enterkeyhint="next" value="${esc(d.name)}"><div class="err">Please enter your name.</div></div>
    <div class="field" data-f="email"><label for="email">Email</label><input type="email" id="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" value="${esc(d.email)}"><div class="err">Please enter a valid email address, e.g. name@example.com.</div></div>
    <div class="field"><span class="lbl">How would you prefer I contact you? <span class="opt">(optional)</span></span>${chips('contact',CONTACT,d.contact,false)}</div>
    <div class="field" data-f="phone"><label for="phone">Phone ${needPhone()?'':'<span class="opt">(optional)</span>'}<span class="sub">UK mobile</span></label><div class="tel"><span class="cc" aria-hidden="true">🇬🇧 +44</span><input type="tel" id="phone" maxlength="${MAX.phone}" autocomplete="tel-national" inputmode="tel" enterkeyhint="done" value="${esc(d.phone)}" placeholder="7700 900123" aria-label="UK mobile number"></div><div class="err" id="phoneErr">Please enter a UK mobile number, e.g. 07700 900123.</div></div>

    <label class="check"><input type="checkbox" id="marketing" ${d.marketing?'checked':''}><span>I’d like to receive occasional travel inspiration from ${W}. <span class="opt">(optional, unsubscribe any time)</span></span></label>
    <p class="privnote">I’ll only use your details to respond to your enquiry. See the <a href="#privacy" data-privacy>privacy notice</a>.</p>
    <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off" value=""></label></div>
    ${S.error?`<div class="alert" role="alert"><b>Sorry, your enquiry didn’t send.</b><br>Nothing has been lost. Your answers are still here. ${S.errorMsg||'Please try again, or email hello.saskio@gmail.com.'}<br><button type="button" id="retry">Try again</button></div>`:''}
    <div class="navbtns"><button type="button" class="back" data-back ${S.sending?'disabled':''}>Back</button><button class="primary" type="submit" ${S.sending?'disabled':''}>${S.sending?'Sending…':'Send my enquiry'}</button></div>`;
  }
  return h+`</form></div>`;
}
function privacyNotice(back){
  return `<div class="pn">
    ${back?`<button type="button" class="back" data-pback>← Back</button>`:''}
    <div class="brand" style="margin-top:22px">${W}</div>
    <h2 style="text-align:center;margin-top:18px">Privacy notice</h2>
    <p class="ver" style="text-align:center">Version 1.0 · 18 November 2026</p>
    <h3>Who I am</h3>
    <p>${W} is an independent, experience-led travel business run by me, Victoria Kelly. I’m responsible for the personal information you share through Discover. You can contact me at hello.saskio@gmail.com.</p>
    <h3>What I collect</h3>
    <ul><li>Your name, email address and, if you choose, your phone number and how you’d like me to contact you.</li>
    <li>Your initial travel ideas: where and when, how long, who’s travelling (number of adults and children, and children’s ages, not their names), approximate budget, whether you’re already looking, and any details you choose to add.</li>
    <li>How you found Discover (for example, an Instagram link).</li>
    <li>Whether you’d like to receive travel inspiration from me, and when you told me.</li></ul>
    <h3>How I use it</h3>
    <p>Only to respond to your enquiry, talk with you about your trip, and support any booking you decide to make. This is in both our interests and is a step you’ve asked me to take. I’ll only send you travel inspiration if you’ve ticked the box to receive it.</p>
    <h3>Who can see it</h3>
    <p>Only me. When you send your enquiry, it goes securely to my Google account (Google Sheets and Gmail), where it’s kept. This website is hosted by GitHub. Google and GitHub act only as service providers and may process data outside the UK with appropriate safeguards. I don’t sell your information or share it for anyone else’s marketing, and I don’t use it to train AI.</p>
    <h3>If you book</h3>
    <p>If you go ahead with a booking, it’s made through InteleTravel UK and the relevant travel suppliers. They handle your booking details under their own terms and privacy notices, which you’ll receive at that stage.</p>
    <h3>How long I keep it</h3>
    <p>If your enquiry doesn’t go ahead, I’ll delete your details 12 months after we were last in touch. If you book, I keep what’s needed for that booking.</p>
    <h3>Your choices and rights</h3>
    <p>You can ask to see, correct or delete your information, or stop receiving travel inspiration at any time. Just email hello.saskio@gmail.com or use the unsubscribe link. If you’re unhappy with how I’ve handled your information, you can complain to the Information Commissioner’s Office (ico.org.uk).</p>
    ${back?`<p style="margin-top:26px"><button type="button" class="back" data-pback>← ${S.prev==='form'?'Back to your enquiry':'Back to Discover'}</button></p>`:''}
  </div>`;
}
function thanks(){
  return `<div class="ty"><h2>Thank you for your enquiry!</h2>
    <div class="sign">Speak soon,<br>${W}<br><span class="x">x</span></div>
    <p class="note">You’ll receive a confirmation email shortly. Please check your junk or spam folder if you don’t see it.</p></div>`;
}
function needPhone(){return S.d.contact==='Phone call'||S.d.contact==='WhatsApp';}

const curScroll=()=>window.scrollY;
const setScroll=y=>window.scrollTo(0,y);
function refresh(){const y=window.scrollY;render(false,true);window.scrollTo(0,y);}
function render(push,keep){
  $('#app').innerHTML = S.screen==='home'?home():S.screen==='form'?form():S.screen==='privacy'?privacyNotice(true):thanks();
  document.title = S.screen==='form' ? 'Step '+S.step+' of 3 · Saski’O Discover' : S.screen==='privacy' ? 'Privacy notice · Saski’O' : S.screen==='thanks' ? 'Thank you · Saski’O' : 'Saski’O Discover';
  if(!keep)window.scrollTo(0,0); bind();
  if(push!==false){try{history.pushState({screen:S.screen,step:S.step},'');}catch(e){}}
}

/* ---------- Behaviour ---------- */
function bind(){
  document.querySelectorAll('#app [data-go]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==='form'){S.screen='form';S.step=1;S.hidden.entry='homepage';
      // Route B: the channel tag that brought the visitor to the homepage is carried into the form
      if(!S.hidden.utm_source){S.hidden.utm_source='unknown';S.hidden.utm_medium='homepage';}
      draft();}
    else S.screen=g;
    render();});
  const goBack=()=>{save();S.error=false;if(S.step===1){S.screen='home';}else{S.step--;}render();};
  document.querySelectorAll('#app [data-back],#app [data-topback]').forEach(b=>b.onclick=goBack);
  document.querySelectorAll('#app [data-chips]').forEach(g=>g.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    save();const k=g.dataset.chips,v=c.dataset.val;
    if(g.dataset.multi==='1'){const a=S.d[k];const i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);}
    else S.d[k]=(S.d[k]===v&&!['dateMode','looking','budget'].includes(k))?'':v;
    if(k==='looking'&&S.d.looking===LOOKING[2])S.d.found='';
    refresh();}));
  document.querySelectorAll('#app [data-step]').forEach(b=>b.onclick=()=>{save();const k=b.dataset.step;
    S.d[k]=Math.max(k==='adults'?1:0,Math.min(12,S.d[k]+Number(b.dataset.d)));
    S.d.ages=S.d.ages.slice(0,S.d.children);refresh();});
  document.querySelectorAll('#app [data-count]').forEach(c=>{const el=document.getElementById(c.dataset.count);
    el.addEventListener('input',()=>{const n=el.value.length,m=MAX[c.dataset.count];c.textContent=`${n} / ${m}`;c.classList.toggle('near',n>=m-25);});});
  document.querySelectorAll('#app [data-privacy]').forEach(b=>b.onclick=e=>{e.preventDefault();save();S.prev=S.screen;S.prevScroll=curScroll();S.screen='privacy';render();});
  document.querySelectorAll('#app [data-pback]').forEach(b=>b.onclick=()=>{S.screen=S.prev||'home';render();setScroll(S.prevScroll||0);});
  const r=$('#retry'); if(r) r.onclick=()=>{save();next();};
  const f=$('#f'); if(f) f.onsubmit=e=>{e.preventDefault();save();next();};
}
function save(){
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():undefined};
  ['dest','from','to','flex','found','notes','name','email','phone'].forEach(k=>{const x=v(k);if(x!==undefined)S.d[k]=x.slice(0,MAX[k]||1000);});
  document.querySelectorAll('[data-age]').forEach(s=>S.d.ages[+s.dataset.age]=s.value);
  ['marketing','ukResident'].forEach(k=>{const el=document.getElementById(k);if(el)S.d[k]=el.checked;});
  const hp=document.getElementById('website'); if(hp) S.hp=hp.value;
  draft();
}
function mark(f,bad){const el=document.querySelector(`#app [data-f="${f}"]`);if(el)el.classList.toggle('invalid',bad);return bad;}
function validate(){
  const d=S.d;let bad=[];
  if(S.step===1){
    if(mark('uk',!d.ukResident))bad.push('uk');
    if(mark('dest',!d.dest))bad.push('dest');
    if(mark('dateMode',!d.dateMode))bad.push('dateMode');
    if(d.dateMode==='I have dates in mind'){
      let b=!d.from,msg='Please add an approximate departure date.';
      if(!b&&d.to&&d.to<d.from){b=true;msg='Return date needs to be after departure.';}
      if(!b&&d.from<new Date().toISOString().slice(0,10)){b=true;msg='Please choose a date in the future.';}
      const e=$('#fromErr');if(e)e.textContent=msg;if(mark('from',b))bad.push('from');}
    if(d.dateMode==='I’m flexible'&&mark('flex',!d.flex))bad.push('flex');
    if(mark('ages',d.children>0&&d.ages.slice(0,d.children).some(a=>a===''||a===undefined)))bad.push('ages');
  }
  if(S.step===2){if(mark('budget',!d.budget))bad.push('budget');if(mark('looking',!d.looking))bad.push('looking');}
  if(S.step===3&&!d.ukResident){S.step=1;render();mark('uk',true);const u=document.querySelector('#app [data-f="uk"]');if(u)u.scrollIntoView({block:'center'});return false;}
  if(S.step===3){
    if(mark('name',!d.name))bad.push('name');
    if(mark('email',!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)))bad.push('email');
    {const ph=ukMobile(d.phone),empty=!String(d.phone||'').trim();const pe=document.getElementById('phoneErr');
     if(pe)pe.textContent=empty?('Please add a UK mobile number so I can '+(d.contact==='WhatsApp'?'message you on WhatsApp.':'call you.')):'Please enter a UK mobile number, e.g. 07700 900123.';
     if(mark('phone',(needPhone()&&empty)||(!empty&&!ph)))bad.push('phone');}
  }
  if(bad.length){const el=document.querySelector(`#app [data-f="${bad[0]}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});}
  return !bad.length;
}
function next(){
  if(!validate())return;
  if(S.step<3){S.step++;render();return;}
  if(S.sending)return;                       // duplicate-submission guard
  S.sending=true;S.error=false;render();
  submit();
}

async function submit(){
  const payload=Object.assign({},S.d,S.hidden,{submissionId:S.submissionId,website:S.hp||''});
  payload.ages=S.d.ages.slice(0,S.d.children);
  payload.phone=ukMobile(S.d.phone); payload.ukResident=!!S.d.ukResident;
  const fail=(msg)=>{S.sending=false;S.error=true;S.errorMsg=msg;render(false);const a=document.querySelector('.alert');if(a)a.scrollIntoView({block:'center'});};
  if(!/^https:\/\/script\.google\.com\//.test(ENDPOINT)){fail('Sending isn’t connected yet (test build). Please email hello.saskio@gmail.com.');return;}
  const ctl=('AbortController' in window)?new AbortController():null; const timer=setTimeout(()=>ctl&&ctl.abort(),25000);
  try{
    const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined,redirect:'follow'});
    clearTimeout(timer);
    const out=await res.json();
    if(out&&out.ok){
      clearDraft(); const keepHidden=S.hidden;
      S=fresh(); S.hidden=keepHidden; S.screen='thanks';
      render(false); try{history.replaceState({screen:'thanks'},'');}catch(e){}
      return;
    }
    fail(out&&out.error==='validation'?'Something in your answers needs a quick check. Please look over each step and try again.':undefined);
  }catch(err){clearTimeout(timer);fail(undefined);}
}
window.addEventListener('popstate',e=>{
  const st=e.state; if(!st)return;
  if(S.screen==='thanks'){S=fresh();S.screen='home';render(false);return;}
  if(S.screen!=='privacy')save();
  S.screen=st.screen==='thanks'?'home':st.screen; S.step=st.step||1; S.error=false; render(false);
});
S=fresh(); restore();
if(S.screen==='privacy'){S.prev='home';}
render(false); try{history.replaceState({screen:S.screen,step:S.step},'');}catch(e){}

})();
</script>
</body>
</html>
